services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: backend-app
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URL=mongodb://mongodb:27017/testdb

  frontend:
    build:
      context: ./frontend
    container_name: frontend-app
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
