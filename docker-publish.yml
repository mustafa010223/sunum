name: Publish Docker Images

on:
  push:
    branches: [ "main" ]  # varsayılan branch'in buysa

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        run: |
          docker build -t ghcr.io/mustafa010223/sunum-frontend:latest ./frontend
          docker push ghcr.io/mustafa010223/sunum-frontend:latest

      - name: Build and Push Backend
        run: |
          docker build -t ghcr.io/mustafa010223/sunum-backend:latest ./backend
          docker push ghcr.io/mustafa010223/sunum-backend:latest

