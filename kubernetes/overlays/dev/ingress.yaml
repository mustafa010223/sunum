kind: Ingress
metadata:
  name: frontend-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: ae6d-2a02-8109-842a-f700-d786-cb0f-782e-2bbe.ngrok-free.app
    http:
      paths:
        - path: /
          pathType: Prefix
